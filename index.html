<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Kargolarım - Canlı Takip</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0b1120" />

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    body { -webkit-tap-highlight-color: transparent; }
    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    @keyframes spin-custom {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .animate-spin-custom {
      animation: spin-custom 0.8s linear infinite;
    }
  </style>
</head>
<body class="bg-[#0b1120] text-slate-100 min-h-screen flex flex-col font-sans pb-12">

  <!-- Header -->
  <header class="sticky top-0 z-30 bg-[#0b1120]/90 backdrop-blur-md border-b border-slate-800/80 px-4 py-3.5 sm:px-6">
    <div class="max-w-3xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-indigo-500 to-sky-500 flex items-center justify-center shadow-lg shadow-indigo-500/25">
          <i class="fa-solid fa-box-open text-white text-lg"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg leading-tight text-white flex items-center gap-2">
            Kargolarım
            <span class="text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 flex items-center gap-1">
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> Canlı Servis
            </span>
          </h1>
          <p class="text-xs text-slate-400">Çoklu Kargo Takip & Hareket Geçmişi</p>
        </div>
      </div>
      <div class="text-xs font-mono bg-slate-800/60 px-2.5 py-1 rounded-lg border border-slate-700/60">
        <span class="text-emerald-400 font-semibold">Aktif ✓</span>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-3xl mx-auto w-full px-4 pt-5 flex-1 flex flex-col gap-5">
    
    <!-- Yeni Kargo Ekleme Kartı -->
    <div class="bg-slate-800/70 rounded-2xl border border-slate-700/70 p-4 sm:p-5 shadow-xl backdrop-blur-sm">
      <h2 class="text-sm font-semibold text-slate-200 mb-3 flex items-center gap-2">
        <i class="fa-solid fa-circle-plus text-indigo-400"></i> Yeni Kargo Takibi Ekle
      </h2>

      <form id="trackForm" class="flex flex-col gap-3.5">
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Takip / Barkod Numarası</label>
          <div class="relative">
            <input 
              type="text" 
              id="trackNumber" 
              required
              placeholder="Örn: 62755239371505, 56249252156382..." 
              class="w-full bg-slate-900/90 border border-slate-700/80 text-slate-100 rounded-xl px-4 py-3 pl-11 text-sm font-mono tracking-wider focus:outline-none focus:border-indigo-500 transition-colors uppercase"
            />
            <i class="fa-solid fa-barcode absolute left-4 top-3.5 text-slate-500 text-base"></i>
            <button 
              type="button" 
              id="pasteBtn"
              class="absolute right-2.5 top-2 px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-slate-300 rounded-lg border border-slate-700 transition flex items-center gap-1.5"
            >
              <i class="fa-regular fa-clipboard"></i> Yapıştır
            </button>
          </div>
          <div id="detectBadge" class="mt-2 text-xs flex items-center gap-2 hidden">
            <span class="text-slate-400 text-[11px]">Otomatik Tespit:</span>
            <span id="detectedName" class="font-bold px-2 py-0.5 rounded-md text-[11px] bg-indigo-500/20 text-indigo-300 border border-indigo-500/40"></span>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Kargo Şirketi</label>
            <div class="relative">
              <select id="carrierSelect" class="w-full bg-slate-900/90 border border-slate-700/80 text-slate-200 text-xs font-semibold rounded-xl px-3 py-2.5 pr-8 focus:outline-none focus:border-indigo-500 appearance-none">
                <option value="hepsijet">HepsiJET</option>
                <option value="surat">Sürat Kargo</option>
                <option value="trendyol">Trendyol Express</option>
                <option value="aras">Aras Kargo</option>
