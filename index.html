<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kargolarım</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col p-4 sm:p-6">

  <!-- Üst Başlık -->
  <header class="max-w-2xl mx-auto w-full flex items-center justify-between pb-4 border-b border-slate-800">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white">
        <i class="fa-solid fa-box text-lg"></i>
      </div>
      <div>
        <h1 class="font-bold text-lg text-white">Kargolarım</h1>
        <p class="text-xs text-slate-400">Çoklu Kargo Takip</p>
      </div>
    </div>
    <span class="text-xs bg-slate-800 px-2.5 py-1 rounded text-emerald-400 font-mono">Çevrimiçi</span>
  </header>

  <!-- Ana Alan -->
  <main class="max-w-2xl mx-auto w-full flex-1 flex flex-col gap-4 mt-4">
    
    <!-- Ekleme Formu -->
    <div class="bg-slate-800 rounded-xl p-4 border border-slate-700 flex flex-col gap-3">
      <div>
        <label class="text-xs font-semibold text-slate-400 block mb-1">Takip / Barkod No</label>
        <input type="text" id="trackNum" placeholder="Örn: 62755239371505..." class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm font-mono uppercase focus:outline-none focus:border-indigo-500">
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div>
          <label class="text-xs font-semibold text-slate-400 block mb-1">Kargo Firması</label>
          <select id="carrier" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs font-semibold">
            <option value="hepsijet">HepsiJET</option>
            <option value="surat">Sürat Kargo</option>
            <option value="trendyol">Trendyol Express</option>
            <option value="aras">Aras Kargo</option>
            <option value="yurtici">Yurtiçi Kargo</option>
            <option value="ptt">PTT Kargo</option>
            <option value="dhl">DHL Express</option>
          </select>
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-400 block mb-1">Başlık (Opsiyonel)</label>
          <input type="text" id="trackTitle" placeholder="Örn: Siparişim" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs">
        </div>
      </div>

      <button id="addBtn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold p-2.5 rounded-lg text-sm transition mt-1">
        + Takip Listesine Ekle
      </button>
    </div>

    <!-- Başlık ve Liste -->
    <div class="flex items-center justify-between text-xs font-bold text-slate-400 px-1 mt-2">
      <span>Kayıtlı Kargolar (<span id="totalCount">0</span>)</span>
    </div>

    <div id="cardList" class="flex flex-col gap-3"></div>

    <div id="emptyNotice" class="text-center py-10 border border-dashed border-slate-800 rounded-xl text-slate-500 text-xs hidden">
      Henüz kargo eklenmedi. Yukarıdan takip numarası yazıp ekleyebilirsiniz.
    </div>

  </main>

  <script>
    const URLS = {
      hepsijet: n => `https://hepsijet.com/gonderi-takibi/${encodeURIComponent(n)}`,
      surat: n => `https://suratkargo.com.tr/KargoTakip/?kargotakipno=${encodeURIComponent(n)}`,
      trendyol: n => `https://kargotakip.trendyol.com/?trackingCode=${encodeURIComponent(n)}`,
      aras: n => `https://kargotakip.araskargo.com.tr/mainpage.aspx?code=${encodeURIComponent(n)}`,
      yurtici: n => `https://www.yurticikargo.com/tr/online-servisler/gonderi-sorgula?code=${encodeURIComponent(n)}`,
      ptt: n => `https://gonderitakip.ptt.gov.tr/Track/Verify?q=${encodeURIComponent(n)}`,
      dhl: n => `https://www.dhl.com/tr-tr/home/tracking/tracking-express.html?submit=1&tracking-id=${encodeURIComponent(n)}`
    };

    let items = [];

    function loadData() {
      try {
        const raw = localStorage.getItem('kargolar_db_v1');
        items = raw ? JSON.parse(raw) : [];
      } catch(e) { items = []; }
      render();
    }

    function saveData() {
      localStorage.setItem('kargolar_db_v1', JSON.stringify(items));
    }

    function render() {
      const box = document.getElementById('cardList');
      const empty = document.getElementById('emptyNotice');
      const count = document.getElementById('totalCount');
      
      count.textContent = items.length;
      box.innerHTML = '';

      if (items.length === 0) {
        empty.classList.remove('hidden');
        return;
      }
      empty.classList.add('hidden');

      items.forEach(item => {
        const url = (URLS[item.carrier] || URLS.hepsijet)(item.code);
        const card = document.createElement('div');
        card.className = "bg-slate-800 border border-slate-700 rounded-xl p-3.5 flex flex-col gap-2.5";
        card.innerHTML = `
          <div class="flex items-start justify-between">
            <div>
              <div class="flex items-center gap-2">
                <span class="font-bold text-sm text-white">${item.title || item.carrier.toUpperCase()}</span>
                <span class="text-[10px] bg-slate-700 px-2 py-0.5 rounded text-slate-300 font-bold uppercase">${item.carrier}</span>
              </div>
              <div class="text-xs font-mono text-indigo-400 font-semibold mt-0.5 select-all">${item.code}</div>
            </div>
            <button onclick="removeItem('${item.id}')" class="text-slate-500 hover:text-rose-400 p-1 text-sm">
              <i class="fa-regular fa-trash-can"></i>
            </button>
          </div>
          <div class="flex items-center justify-between pt-2 border-t border-slate-700/60 text-xs">
            <select onchange="updateStat('${item.id}', this.value)" class="bg-slate-900 border border-slate-700 rounded p-1 text-xs">
              <option value="transit" ${item.status === 'transit' ? 'selected' : ''}>🚚 Yolda</option>
              <option value="delivered" ${item.status === 'delivered' ? 'selected' : ''}>✅ Teslim Edildi</option>
            </select>
            <a href="${url}" target="_blank" class="bg-indigo-600 hover:bg-indigo-500 text-white px-2.5 py-1 rounded text-xs font-semibold flex items-center gap-1">
              <span>Canlı Takip</span>
              <i class="fa-solid fa-arrow-up-right-from-square text-[9px]"></i>
            </a>
          </div>
        `;
        box.appendChild(card);
      });
    }

    document.getElementById('addBtn').addEventListener('click', () => {
      const codeEl = document.getElementById('trackNum');
      const carrierEl = document.getElementById('carrier');
      const titleEl = document.getElementById('trackTitle');

      const code = codeEl.value.trim();
      if (!code) {
        alert("Lütfen kargo takip numarasını girin.");
        codeEl.focus();
        return;
      }

      items.unshift({
        id: 'c_' + Date.now(),
        code: code,
        carrier: carrierEl.value,
        title: titleEl.value.trim(),
        status: 'transit'
      });

      saveData();
      render();

      codeEl.value = '';
      titleEl.value = '';
    });

    window.removeItem = function(id) {
      items = items.filter(i => i.id !== id);
      saveData();
      render();
    };

    window.updateStat = function(id, val) {
      const it = items.find(i => i.id === id);
      if (it) {
        it.status = val;
        saveData();
      }
    };

    loadData();
  </script>
</body>
</html>
