<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Kargolarım</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-[#0b1120] text-slate-100 min-h-screen flex flex-col pb-16">

  <!-- Header -->
  <header class="sticky top-0 z-30 bg-[#0b1120]/95 backdrop-blur border-b border-slate-800 px-4 py-3 sm:px-6">
    <div class="max-w-3xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 to-sky-500 flex items-center justify-center shadow-lg shadow-indigo-500/25">
          <i class="fa-solid fa-box-open text-white text-lg"></i>
        </div>
        <div>
          <h1 class="font-bold text-base sm:text-lg leading-tight text-white flex items-center gap-2">
            Kargolarım
            <span class="text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">
              Aktif
            </span>
          </h1>
          <p class="text-xs text-slate-400">Çoklu Kargo Takip Paneli</p>
        </div>
      </div>
      <span class="text-xs font-mono bg-slate-800 px-2.5 py-1 rounded-lg border border-slate-700 text-emerald-400">
        Hazır ✓
      </span>
    </div>
  </header>

  <!-- Ana Alan -->
  <main class="max-w-3xl mx-auto w-full px-4 pt-5 flex-1 flex flex-col gap-5">
    
    <!-- Ekleme Formu -->
    <div class="bg-slate-800/80 rounded-2xl border border-slate-700/80 p-4 sm:p-5 shadow-xl">
      <h2 class="text-sm font-semibold text-slate-200 mb-3 flex items-center gap-2">
        <i class="fa-solid fa-circle-plus text-indigo-400"></i> Yeni Kargo Ekle
      </h2>

      <form id="trackForm" class="flex flex-col gap-3">
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Takip / Barkod Numarası</label>
          <div class="relative">
            <input 
              type="text" 
              id="trackNumber" 
              required
              placeholder="Örn: 62755239371505, 56249252156382..." 
              class="w-full bg-slate-900 border border-slate-700 text-slate-100 rounded-xl px-4 py-2.5 pl-10 text-sm font-mono tracking-wider focus:outline-none focus:border-indigo-500 uppercase"
            />
            <i class="fa-solid fa-barcode absolute left-3.5 top-3 text-slate-500 text-sm"></i>
            <button 
              type="button" 
              id="pasteBtn"
              class="absolute right-2 top-1.5 px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-slate-300 rounded-lg border border-slate-700"
            >
              Yapıştır
            </button>
          </div>
          <div id="detectBadge" class="mt-1.5 text-xs flex items-center gap-1.5 hidden">
            <span class="text-slate-400 text-[11px]">Tespit:</span>
            <span id="detectedName" class="font-bold px-2 py-0.5 rounded text-[11px] bg-indigo-500/20 text-indigo-300 border border-indigo-500/40"></span>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Kargo Firması</label>
            <select id="carrierSelect" class="w-full bg-slate-900 border border-slate-700 text-slate-200 text-xs font-semibold rounded-xl px-3 py-2.5 focus:outline-none focus:border-indigo-500">
              <option value="hepsijet">HepsiJET</option>
              <option value="surat">Sürat Kargo</option>
              <option value="trendyol">Trendyol Express</option>
              <option value="aras">Aras Kargo</option>
              <option value="yurtici">Yurtiçi Kargo</option>
              <option value="ptt">PTT Kargo</option>
