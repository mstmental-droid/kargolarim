<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kargolarım</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-[#0b1120] text-slate-100 min-h-screen flex flex-col pb-16">

  <header class="sticky top-0 z-30 bg-[#0b1120] border-b border-slate-800 px-4 py-3">
    <div class="max-w-3xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white shadow">
          <i class="fa-solid fa-box-open text-lg"></i>
        </div>
        <div>
          <h1 class="font-bold text-base text-white">Kargolarım</h1>
          <p class="text-xs text-slate-400">Çoklu Kargo Takip Paneli</p>
        </div>
      </div>
      <span class="text-xs bg-slate-800 px-2.5 py-1 rounded-lg border border-slate-700 text-emerald-400 font-semibold">
        Aktif ✓
      </span>
    </div>
  </header>

  <main class="max-w-3xl mx-auto w-full px-4 pt-5 flex-1 flex flex-col gap-5">
    
    <div class="bg-slate-800/80 rounded-2xl border border-slate-700 p-4 shadow-xl">
      <h2 class="text-sm font-semibold text-slate-200 mb-3 flex items-center gap-2">
        <i class="fa-solid fa-circle-plus text-indigo-400"></i> Yeni Kargo Ekle
      </h2>

      <form id="trackForm" class="flex flex-col gap-3">
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Takip / Barkod Numarası</label>
          <div class="relative">
            <input 
              type="text" 
              id="trackNumber" 
              required
              placeholder="Örn: 62755239371505, 56249252156382..." 
              class="w-full bg-slate-900 border border-slate-700 text-slate-100 rounded-xl px-4 py-2.5 pl-10 text-sm font-mono uppercase focus:outline-none focus:border-indigo-500"
            />
            <i class="fa-solid fa-barcode absolute left-3.5 top-3 text-slate-500 text-sm"></i>
            <button 
              type="button" 
              id="pasteBtn"
              class="absolute right-2 top-1.5 px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-slate-300 rounded-lg border border-slate-700"
            >
              Yapıştır
            </button>
          </div>
          <div id="detectBadge" class="mt-1.5 text-xs flex items-center gap-1.5 hidden">
            <span class="text-slate-400 text-[11px]">Tespit:</span>
            <span id="detectedName" class="font-bold px-2 py-0.5 rounded text-[11px] bg-indigo-500/20 text-indigo-300 border border-indigo-500/40"></span>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Kargo Firması</label>
            <select id="carrierSelect" class="w-full bg-slate-900 border border-slate-700 text-slate-200 text-xs font-semibold rounded-xl px-3 py-2.5 focus:outline-none focus:border-indigo-500">
              <option value="hepsijet">HepsiJET</option>
              <option value="surat">Sürat Kargo</option>
              <option value="trendyol">Trendyol Express</option>
              <option value="aras">Aras Kargo</option>
              <option value="yurtici">Yurtiçi Kargo</option>
              <option value="ptt">PTT Kargo</option>
              <option value="dhl">DHL Express</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Başlık / Açıklama</label>
            <input 
              type="text" 
              id="trackTitle" 
              placeholder="Örn: Siparişim..." 
              class="w-full bg-slate-900 border border-slate-700 text-slate-100 rounded-xl px-3 py-2.5 text-xs focus:outline-none focus:border-indigo-500"
            />
          </div>
        </div>

        <button 
          type="submit" 
          class="w-full mt-1 bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 px-4 rounded-xl text-xs sm:text-sm shadow-lg shadow-indigo-600/30 flex items-center justify-center gap-2"
        >
          <i class="fa-solid fa-plus"></i> Takip Listesine Ekle
        </button>
      </form>
    </div>

    <div class="flex items-center justify-between">
      <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-2">
        <span>Kayıtlı Kargolar</span>
        <span id="packageCount" class="bg-slate-800 text-slate-300 px-2 py-0.5 rounded-full text-[10px] border border-slate-700">0</span>
      </h3>
      <div class="flex items-center gap-1 bg-slate-800 p-1 rounded-xl border border-slate-700 text-xs">
        <button onclick="setFilter('all')" id="btn-all" class="px-2.5 py-1 rounded-lg text-white font-medium bg-indigo-600 text-[11px]">Tümü</button>
        <button onclick="setFilter('active')" id="btn-active" class="px-2.5 py-1 rounded-lg text-slate-400 font-medium hover:text-white text-[11px]">Yoldakiler</button>
        <button onclick="setFilter('delivered')" id="btn-delivered" class="px-2.5 py-1 rounded-lg text-slate-400 font-medium hover:text-white text-[11px]">Teslim Edildi</button>
      </div>
    </div>

    <div id="shipmentList" class="flex flex-col gap-3"></div>

    <div id="emptyBox" class="py-12 flex flex-col items-center justify-center text-center px-4 border border-dashed border-slate-800 rounded-2xl hidden">
      <div class="w-12 h-12 rounded-full bg-slate-800 flex items-center justify-center text-slate-600 mb-2">
        <i class="fa-solid fa-box text-xl"></i>
      </div>
      <p class="text-sm font-semibold text-slate-400">Henüz kayıtlı kargo yok</p>
      <p class="text-xs text-slate-500 mt-0.5">Yukarıdaki formdan takip numaranızı girip ekleyebilirsiniz.</p>
    </div>
  </main>

  <script>
    const STORAGE_KEY = "kargolarim_data_v2";

    const CARRIERS = {
      hepsijet: {
        name: "HepsiJET",
        badge: "bg-orange-500/20 text-orange-400 border-orange-500/30",
        icon: "fa-solid fa-bolt",
        getUrl: (n) => `https://hepsijet.com/gonderi-takibi/${encodeURIComponent(n)}`
      },
      aras: {
        name: "Aras Kargo",
        badge: "bg-sky-500/20 text-sky-400 border-sky-500/30",
        icon: "fa-solid fa-paper-plane",
        getUrl: (n) => `https://kargotakip.araskargo.com.tr/mainpage.aspx?code=${encodeURIComponent(n)}`
      },
      surat: {
        name: "Sürat Kargo",
        badge: "bg-red-500/20 text-red-400 border-red-500/30",
        icon: "fa-solid fa-gauge-high",
        getUrl: (n) => `https://suratkargo.com.tr/KargoTakip/?kargotakipno=${encodeURIComponent(n)}`
      },
      yurtici: {
        name: "Yurtiçi Kargo",
        badge: "bg-amber-500/20 text-amber-400 border-amber-500/30",
        icon: "fa-solid fa-truck-fast",
        getUrl: (n) => `https://www.yurticikargo.com/tr/online-servisler/gonderi-sorgula?code=${encodeURIComponent(n)}`
      },
      trendyol: {
        name: "Trendyol Express",
        badge: "bg-amber-500/20 text-amber-300 border-amber-500/30",
        icon: "fa-solid fa-bag-shopping",
        getUrl: (n) => `https://kargotakip.trendyol.com/?trackingCode=${encodeURIComponent(n)}`
      },
      ptt: {
        name: "PTT Kargo",
        badge: "bg-yellow-500/20 text-yellow-300 border-yellow-500/30",
        icon: "fa-solid fa-envelope",
        getUrl: (n) => `https://gonderitakip.ptt.gov.tr/Track/Verify?q=${encodeURIComponent(n)}`
      },
      dhl: {
        name: "DHL Express",
        badge: "bg-yellow-500/20 text-yellow-400 border-yellow-500/30",
        icon: "fa-solid fa-plane-departure",
        getUrl: (n) => `https://www.dhl.com/tr-tr/home/tracking/tracking-express.html?submit=1&tracking-id=${encodeURIComponent(n)}`
      }
    };

    function detectCarrierSmart(rawCode) {
      const code = String(rawCode || '').trim().toUpperCase();
      if (!code) return null;
      if (code.startsWith('KP') || code.startsWith('RR') || code.startsWith('CP')) return 'ptt';
      if (code.startsWith('HJ') || code.startsWith('HX') || code.includes('JET')) return 'hepsijet';
      if (code.startsWith('TY') || code.startsWith('TEX') || code.startsWith('TND')) return 'trendyol';
      if (code.startsWith('SRT')) return 'surat';
      if (code.startsWith('6275') || code.startsWith('62')) return 'hepsijet';
      if (/^2\d{12}$/.test(code)) return 'ptt';
      if (/^\d{10}$/.test(code)) return 'dhl';
      if (/^\d{12}$/.test(code)) return 'yurtici';
      if (code.startsWith('65') || code.startsWith('33') || code.startsWith('22')) return 'aras';
      if (code.startsWith('56') || /^\d{11}$/.test(code)) return 'surat';
      return null;
    }

    let shipments = [];
    let currentFilter = 'all';

    function loadShipments() {
      try {
        const stored = localStorage.getItem(STORAGE_KEY);
        shipments = stored ? JSON.parse(stored) : [];
      } catch (e) {
        shipments = [];
      }
      renderShipments();
    }

    function saveShipments() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(shipments));
      } catch (e) {}
    }

    function setFilter(type) {
      currentFilter = type;
      ['all', 'active', 'delivered'].forEach(k => {
        const el = document.getElementById(`btn-${k}`);
        if (el) {
          el.className = (k === type) 
            ? "px-2.5 py-1 rounded-lg text-white font-medium bg-indigo-600 text-[11px]" 
            : "px-2.5 py-1 rounded-lg text-slate-400 font-medium hover:text-white text-[11px]";
        }
      });
      renderShipments();
    }

    function renderShipments() {
      const listEl = document.getElementById('shipmentList');
      const emptyEl = document.getElementById('emptyBox');
      const countEl = document.getElementById('packageCount');

      const filtered = shipments.filter(item => {
        if (currentFilter === 'active') return item.status !== 'delivered';
        if (currentFilter === 'delivered') return item.status === 'delivered';
        return true;
      });

      countEl.textContent = filtered.length;
      listEl.innerHTML = '';

      if (filtered.length === 0) {
        emptyEl.classList.remove('hidden');
        return;
      }

      emptyEl.classList.add('hidden');

      filtered.forEach(item => {
        const carrier = CARRIERS[item.carrier] || CARRIERS.hepsijet;
        const officialUrl = carrier.getUrl(item.trackingNumber);
        const isDelivered = item.status === 'delivered';

        const card = document.createElement('div');
        card.className = "bg-slate-800/80 border border-slate-700 rounded-2xl p-4 shadow-lg flex flex-col gap-3";

        card.innerHTML = `
          <div class="flex items-start justify-between gap-3">
            <div class="flex items-center gap-3 min-w-0">
              <div class="w-10 h-10 rounded-xl bg-slate-700 flex items-center justify-center text-white shrink-0">
                <i class="${carrier.icon} text-lg"></i>
              </div>
              <div class="min-w-0">
                <div class="flex items-center gap-2 flex-wrap">
                  <h4 class="font-bold text-sm text-slate-100 truncate">${item.title || carrier.name}</h4>
                  <span class="text-[10px] font-bold px-2 py-0.5 rounded-full border ${carrier.badge}">
                    ${carrier.name}
                  </span>
                </div>
                <div class="flex items-center gap-2 mt-0.5">
                  <span class="font-mono text-xs text-indigo-400 font-semibold select-all">${item.trackingNumber}</span>
                  <button onclick="copyNumber('${item.trackingNumber}')" class="text-slate-500 hover:text-slate-300 text-xs">
                    <i class="fa-regular fa-copy"></i>
                  </button>
                </div>
              </div>
            </div>

            <button onclick="deleteShipment('${item.id}')" class="text-slate-500 hover:text-rose-400 p-1.5 text-sm transition">
              <i class="fa-regular fa-trash-can"></i>
            </button>
          </div>

          <div class="flex flex-wrap items-center justify-between gap-2 pt-2 border-t border-slate-700 text-xs">
            <div class="flex items-center gap-2">
              <label class="text-[11px] text-slate-400">Durum:</label>
              <select onchange="updateStatus('${item.id}', this.value)" class="bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1 text-xs font-semibold ${isDelivered ? 'text-emerald-400' : 'text-amber-400'} focus:outline-none">
                <option value="transit" ${item.status === 'transit' ? 'selected' : ''}>🚚 Yolda</option>
                <option value="out_for_delivery" ${item.status === 'out_for_delivery' ? 'selected' : ''}>🛵 Dağıtımda</option>
                <option value="delivered" ${item.status === 'delivered' ? 'selected' : ''}>✅ Teslim Edildi</option>
              </select>
            </div>

            <a 
              href="${officialUrl}" 
              target="_blank" 
              rel="noopener noreferrer" 
              class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-semibold transition text-xs shadow"
            >
              <span>Resmi Sitede Hareketleri Gör</span>
              <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
            </a>
          </div>
        `;
        listEl.appendChild(card);
      });
    }

    const trackInput = document.getElementById('trackNumber');
    const carrierSelect = document.getElementById('carrierSelect');
    const detectBadge = document.getElementById('detectBadge');
    const detectedName = document.getElementById('detectedName');

    trackInput.addEventListener('input', (e) => {
      const code = e.target.value.trim();
      const detected = detectCarrierSmart(code);
      if (detected && CARRIERS[detected]) {
        carrierSelect.value = detected;
        detectedName.textContent = CARRIERS[detected].name;
        detectBadge.classList.remove('hidden');
      } else {
        detectBadge.classList.add('hidden');
      }
    });

    document.getElementById('pasteBtn').addEventListener('click', async () => {
      try {
        const text = await navigator.clipboard.readText();
        if (text) {
          trackInput.value = text.trim();
          trackInput.dispatchEvent(new Event('input'));
        }
      } catch (err) {
        alert("Pano izni verilemedi, lütfen elle yapıştırın.");
      }
    });

    document.getElementById('trackForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const code = trackInput.value.trim();
      const carrier = carrierSelect.value;
      const title = document.getElementById('trackTitle').value.trim();

      if (!code) return;

      const newShipment = {
        id: 'pkg_' + Date.now(),
        trackingNumber: code,
        carrier: carrier,
        title: title || '',
        status: 'transit',
        createdAt: new Date().toISOString()
      };

      shipments.unshift(newShipment);
      saveShipments();
      renderShipments();

      trackInput.value = '';
      document.getElementById('trackTitle').value = '';
      detectBadge.classList.add('hidden');
    });

    window.updateStatus = function(id, newStatus) {
      const item = shipments.find(s => s.id === id);
      if (item) {
        item.status = newStatus;
        saveShipments();
        renderShipments();
      }
    };

    window.deleteShipment = function(id)
