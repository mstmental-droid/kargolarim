<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Kargolarım - Akıllı Takip</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0b1120" />

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    body { -webkit-tap-highlight-color: transparent; }
    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
  </style>

  <!-- Firebase Compat SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-[#0b1120] text-slate-100 min-h-screen flex flex-col font-sans pb-12">

  <!-- Header -->
  <header class="sticky top-0 z-30 bg-[#0b1120]/90 backdrop-blur-md border-b border-slate-800/80 px-4 py-3.5 sm:px-6">
    <div class="max-w-3xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-indigo-500 to-sky-500 flex items-center justify-center shadow-lg shadow-indigo-500/25">
          <i class="fa-solid fa-box-open text-white text-lg"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg leading-tight text-white flex items-center gap-2">
            Kargolarım
            <span class="text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 flex items-center gap-1">
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> Bulut Aktif
            </span>
          </h1>
          <p class="text-xs text-slate-400">Çoklu Kargo Takip & Canlı Senkronizasyon</p>
        </div>
      </div>
      <div class="text-xs text-slate-400 font-mono bg-slate-800/60 px-2.5 py-1 rounded-lg border border-slate-700/60">
        <span id="syncStatus">Bağlanıyor...</span>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-3xl mx-auto w-full px-4 pt-5 flex-1 flex flex-col gap-5">
    
    <!-- Yeni Kargo Ekleme Kartı -->
    <div class="bg-slate-800/70 rounded-2xl border border-slate-700/70 p-4 sm:p-5 shadow-xl backdrop-blur-sm">
      <h2 class="text-sm font-semibold text-slate-200 mb-3 flex items-center gap-2">
        <i class="fa-solid fa-circle-plus text-indigo-400"></i> Yeni Kargo Takibi Ekle
      </h2>

      <form id="trackForm" class="flex flex-col gap-3.5">
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Takip / Barkod Numarası</label>
          <div class="relative">
            <input 
              type="text" 
              id="trackNumber" 
              required
              placeholder="Örn: 62755239371505, 6505740207439..." 
              class="w-full bg-slate-900/90 border border-slate-700/80 text-slate-100 rounded-xl px-4 py-3 pl-11 text-sm font-mono tracking-wider focus:outline-none focus:border-indigo-500 transition-colors uppercase"
            />
            <i class="fa-solid fa-barcode absolute left-4 top-3.5 text-slate-500 text-base"></i>
            <button 
              type="button" 
              id="pasteBtn"
              class="absolute right-2.5 top-2 px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-slate-300 rounded-lg border border-slate-700 transition flex items-center gap-1.5"
            >
              <i class="fa-regular fa-clipboard"></i> Yapıştır
            </button>
          </div>
          <div id="detectBadge" class="mt-2 text-xs flex items-center gap-2 hidden">
            <span class="text-slate-400 text-[11px]">Otomatik Tespit Edildi:</span>
            <span id="detectedName" class="font-bold px-2 py-0.5 rounded-md text-[11px] bg-indigo-500/20 text-indigo-300 border border-indigo-500/40"></span>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Kargo Şirketi</label>
            <div class="relative">
              <select id="carrierSelect" class="w-full bg-slate-900/90 border border-slate-700/80 text-slate-200 text-xs font-semibold rounded-xl px-3 py-2.5 pr-8 focus:outline-none focus:border-indigo-500 appearance-none">
                <option value="hepsijet">HepsiJET</option>
                <option value="aras">Aras Kargo</option>
                <option value="surat">Sürat Kargo</option>
                <option value="yurtici">Yurtiçi Kargo</option>
                <option value="trendyol">Trendyol Express</option>
                <option value="ptt">PTT Kargo</option>
                <option value="dhl">DHL Express</option>
              </select>
              <i class="fa-solid fa-chevron-down absolute right-3 top-3 text-slate-500 text-[10px] pointer-events-none"></i>
            </div>
          </div>

          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Kargo Başlığı / Açıklama</label>
            <input 
              type="text" 
              id="trackTitle" 
              placeholder="Örn: 18650 Piller, Havya Ucu, Mini PC..." 
              class="w-full bg-slate-900/90 border border-slate-700/80 text-slate-100 rounded-xl px-3 py-2.5 text-xs focus:outline-none focus:border-indigo-500 transition-colors"
            />
          </div>
        </div>

        <button 
          type="submit" 
          class="w-full mt-1 bg-gradient-to-r from-indigo-600 to-sky-600 hover:from-indigo-500 hover:to-sky-500 text-white font-bold py-2.5 px-4 rounded-xl text-xs sm:text-sm shadow-lg shadow-indigo-600/30 flex items-center justify-center gap-2 transition-all active:scale-[0.99]"
        >
          <i class="fa-solid fa-plus"></i> Takip Listesine Ekle
        </button>
      </form>
    </div>

    <!-- Filtreler -->
    <div class="flex items-center justify-between mt-2">
      <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-2">
        <span>Kayıtlı Kargolar</span>
        <span id="packageCount" class="bg-slate-800 text-slate-300 px-2 py-0.5 rounded-full text-[10px] border border-slate-700">0</span>
      </h3>
      <div class="flex items-center gap-1.5 bg-slate-800/80 p-1 rounded-xl border border-slate-700/60 text-xs">
        <button data-filter="all" class="filter-btn px-2.5 py-1 rounded-lg text-white font-medium bg-indigo-600 transition text-[11px]">Tümü</button>
        <button data-filter="active" class="filter-btn px-2.5 py-1 rounded-lg text-slate-400 font-medium hover:text-white transition text-[11px]">Yoldakiler</button>
        <button data-filter="delivered" class="filter-btn px-2.5 py-1 rounded-lg text-slate-400 font-medium hover:text-white transition text-[11px]">Teslim Edildi</button>
      </div>
    </div>

    <!-- Kargo Listesi -->
    <div id="shipmentList" class="flex flex-col gap-3.5">
      <div id="emptyState" class="py-12 flex flex-col items-center justify-center text-center px-4 border border-dashed border-slate-800 rounded-2xl">
        <div class="w-14 h-14 rounded-full bg-slate-800/80 flex items-center justify-center text-slate-600 mb-3">
          <i class="fa-solid fa-box text-2xl"></i>
        </div>
        <p class="text-sm font-semibold text-slate-400">Henüz kayıtlı kargo bulunmuyor</p>
        <p class="text-xs text-slate-500 mt-1 max-w-xs">Yukarıdaki formdan takip numaranızı girerek kargonuzu kaydedebilirsiniz.</p>
      </div>
    </div>
  </main>

  <!-- Hareket Ekleme Modal -->
  <div id="eventModal" class="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-md p-5 shadow-2xl relative">
      <button id="closeEventModal" class="absolute right-4 top-4 text-slate-400 hover:text-white">
        <i class="fa-solid fa-xmark text-lg"></i>
      </button>

      <h3 class="text-base font-bold text-white mb-1 flex items-center gap-2">
        <i class="fa-solid fa-timeline text-indigo-400"></i> Kargo Hareketi Ekle
      </h3>
      <p id="eventModalSubtitle" class="text-xs text-slate-400 mb-4"></p>

      <form id="addEventForm" class="flex flex-col gap-3">
        <input type="hidden" id="eventShipmentId" />
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Hareket Açıklaması</label>
          <input type="text" id="eventDetail" required placeholder="Örn: Transfer Merkezine Geldi" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-indigo-500" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Şube / Lokasyon</label>
          <input type="text" id="eventLocation" placeholder="Örn: Bahçelievler Dağıtım / İstanbul" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-indigo-500" />
        </div>
        <div class="flex justify-end gap-2 mt-2">
          <button type="submit" class="px-4 py-2 text-xs font-bold text-white bg-indigo-600 hover:bg-indigo-500 rounded-xl transition">
            Kaydet
          </button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // Firebase Config (Kişisel Projeniz Doğrudan Entegre Edildi)
    const firebaseConfig = {
      apiKey: "AIzaSyDbG02kMHx8NH9Nab2gUWX35uGbOdgbXe4",
      authDomain: "kargolarim-app.firebaseapp.com",
      projectId: "kargolarim-app",
      storageBucket: "kargolarim-app.firebasestorage.app",
      messagingSenderId: "780260727059",
      appId: "1:780260727059:web:424eeaa7b78785167ca2e6"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const CARRIERS = {
      hepsijet: {
        name: "HepsiJET",
        color: "from-orange-500 to-amber-600",
        badge: "bg-orange-500/20 text-orange-400 border-orange-500/30",
        icon: "fa-solid fa-bolt",
        getUrl: (num) => `https://hepsijet.com/gonderi-takibi/${encodeURIComponent(num)}`
      },
      aras: {
        name: "Aras Kargo",
        color: "from-sky-500 to-blue-600",
        badge: "bg-sky-500/20 text-sky-400 border-sky-500/30",
        icon: "fa-solid fa-paper-plane",
        getUrl: (num) => `https://kargotakip.araskargo.com.tr/mainpage.aspx?code=${encodeURIComponent(num)}`
      },
      surat: {
        name: "Sürat Kargo",
        color: "from-red-500 to-rose-600",
        badge: "bg-red-500/20 text-red-400 border-red-500/30",
        icon: "fa-solid fa-gauge-high",
        getUrl: (num) => `https://suratkargo.com.tr/KargoTakip/?kargotakipno=${encodeURIComponent(num)}`
      },
      yurtici: {
        name: "Yurtiçi Kargo",
        color: "from-amber-500 to-yellow-600",
        badge: "bg-amber-500/20 text-amber-400 border-amber-500/30",
        icon: "fa-solid fa-truck-fast",
        getUrl: (num) => `https://www.yurticikargo.com/tr/online-servisler/gonderi-sorgula?code=${encodeURIComponent(num)}`
      },
      trendyol: {
        name: "Trendyol Express",
        color: "from-amber-600 to-orange-600",
        badge: "bg-amber-500/20 text-amber-300 border-amber-500/30",
        icon: "fa-solid fa-bag-shopping",
        getUrl: (num) => `https://kargotakip.trendyol.com/?trackingCode=${encodeURIComponent(num)}`
      },
      ptt: {
        name: "PTT Kargo",
        color: "from-yellow-500 to-amber-600",
        badge: "bg-yellow-500/20 text-yellow-300 border-yellow-500/30",
        icon: "fa-solid fa-envelope",
        getUrl: (num) => `https://gonderitakip.ptt.gov.tr/Track/Verify?q=${encodeURIComponent(num)}`
      },
      dhl: {
        name: "DHL Express",
        color: "from-yellow-600 to-red-600",
        badge: "bg-yellow-500/20 text-yellow-400 border-yellow-500/30",
        icon: "fa-solid fa-plane-departure",
        getUrl: (num) => `https://www.dhl.com/tr-tr/home/tracking/tracking-express.html?submit=1&tracking-id=${encodeURIComponent(num)}`
      }
    };

    function detectCarrierSmart(rawCode) {
      const code = rawCode.trim().toUpperCase();
      if (!code) return null;

      if (code.startsWith('KP') || code.startsWith('RR') || code.startsWith('CP')) return 'ptt';
      if (code.startsWith('HJ') || code.startsWith('HX') || code.includes('JET')) return 'hepsijet';
      if (code.startsWith('TY') || code.startsWith('TEX') || code.startsWith('TND')) return 'trendyol';
      if (code.startsWith('SRT')) return 'surat';

      if (code.startsWith('6275') || code.startsWith('62')) return 'hepsijet';
      if (/^2\d{12}$/.test(code)) return 'ptt';
      if (/^\d{10}$/.test(code)) return 'dhl';
      if (/^\d{12}$/.test(code)) return 'yurtici';
      if (code.startsWith('65') || code.startsWith('33') || code.startsWith('22')) return 'aras';
      if (code.startsWith('56') || /^\d{11}$/.test(code)) return 'surat';

      return null;
    }

    let shipments = [];
    let currentFilter = 'all';

    function listenFirestore() {
      const syncEl = document.getElementById('syncStatus');
      db.collection('kargolar').orderBy('createdAt', 'desc').onSnapshot(snap => {
        const list = [];
        snap.forEach(doc => list.push(doc.data()));
        shipments = list;
        syncEl.textContent = 'Senkronize ✓';
        syncEl.className = 'text-emerald-400';
        renderShipments();
      }, err => {
        console.error("Firestore okuma hatası:", err);
        syncEl.textContent = 'Çevrimdışı';
        syncEl.className = 'text-rose-400';
      });
    }

    function formatDate(isoStr) {
      if (!isoStr) return '';
      const d = new Date(isoStr);
      return d.toLocaleDateString('tr-TR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    function renderShipments() {
      const container = document.getElementById('shipmentList');
      const emptyState = document.getElementById('emptyState');
      const countEl = document.getElementById('packageCount');

      const filtered = shipments.filter(item => {
        if (currentFilter === 'active') return item.status !== 'delivered';
        if (currentFilter === 'delivered') return item.status === 'delivered';
        return true;
      });

      countEl.textContent = filtered.length;

      if (filtered.length === 0) {
        container.innerHTML = '';
        container.appendChild(emptyState);
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');
      container.innerHTML = '';

      filtered.forEach(item => {
        const carrier = CARRIERS[item.carrier] || CARRIERS.hepsijet;
        const officialUrl = carrier.getUrl(item.trackingNumber);
        const events = item.events || [];
        const isDelivered = item.status === 'delivered';

        const card = document.createElement('div');
        card.className = "bg-slate-800/80 border border-slate-700/80 rounded-2xl p-4 shadow-lg flex flex-col gap-3.5 transition-all hover:border-slate-600";

        card.innerHTML = `
          <div class="flex items-start justify-between gap-3">
            <div class="flex items-center gap-3 min-w-0">
              <div class="w-10 h-10 rounded-xl bg-gradient-to-br ${carrier.color} flex items-center justify-center text-white shrink-0 shadow-md">
                <i class="${carrier.icon} text-lg"></i>
              </div>
              <div class="min-w-0">
                <div class="flex items-center gap-2 flex-wrap">
                  <h4 class="font-bold text-sm text-slate-100 truncate">${item.title || carrier.name}</h4>
                  <span class="text-[10px] font-bold px-2 py-0.5 rounded-full border ${carrier.badge}">
                    ${carrier.name}
                  </span>
                </div>
                <div class="flex items-center gap-2 mt-0.5">
                  <span class="font-mono text-xs text-indigo-400 font-semibold select-all">${item.trackingNumber}</span>
                  <button onclick="copyToClipboard('${item.trackingNumber}')" class="text-slate-500 hover:text-slate-300 text-xs" title="Takip No Kopyala">
                    <i class="fa-regular fa-copy"></i>
                  </button>
                </div>
              </div>
            </div>

            <div class="flex items-center gap-1 shrink-0">
              <button onclick="deleteShipment('${item.id}')" class="text-slate-500 hover:text-rose-400 p-2 text-sm transition" title="Takibi Sil">
                <i class="fa-regular fa-trash-can"></i>
              </button>
            </div>
          </div>

          <div class="bg-slate-900/80 rounded-xl p-3 border border-slate-800">
            <div class="flex items-center justify-between mb-2">
              <span class="text-[11px] font-bold uppercase tracking-wider text-slate-400 flex items-center gap-1.5">
                <i class="fa-solid fa-clock-rotate-left text-indigo-400"></i> Kargo Hareketleri (${events.length})
              </span>
              <button onclick="openAddEventModal('${item.id}')" class="text-[11px] font-semibold text-indigo-400 hover:text-indigo-300 flex items-center gap-1">
                <i class="fa-solid fa-plus text-[10px]"></i> Hareket Ekle
              </button>
            </div>

            ${events.length === 0 ? `
              <div class="py-2.5 text-center text-[11px] text-slate-500">
                Kayıtlı hareket yok. Detaylar için resmi sitede sorgulayabilir veya manuel hareket ekleyebilirsiniz.
              </div>
            ` : `
              <div class="flex flex-col gap-2 max-h-48 overflow-y-auto custom-scrollbar pr-1">
                ${events.slice().reverse().map(ev => `
                  <div class="flex items-start gap-2.5 text-xs border-l-2 border-indigo-500/50 pl-2.5 py-1">
                    <div class="flex-1">
                      <div class="font-medium text-slate-200">${ev.detail}</div>
                      ${ev.location ? `<div class="text-[10px] text-slate-400 flex items-center gap-1"><i class="fa-solid fa-location-dot text-[9px] text-slate-500"></i> ${ev.location}</div>` : ''}
                    </div>
                    <span class="text-[10px] text-slate-500 font-mono shrink-0">${formatDate(ev.date)}</span>
                  </div>
                `).join('')}
              </div>
            `}
          </div>

          <div class="flex flex-wrap items-center justify-between gap-2 pt-2 border-t border-slate-700/60 text-xs">
            <div class="flex items-center gap-2">
              <label class="text-[11px] text-slate-400">Durum:</label>
              <select onchange="updateStatus('${item.id}', this.value)" class="bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1 text-xs font-semibold ${isDelivered ? 'text-emerald-400' : 'text-amber-400'} focus:outline-none">
                <option value="transit" ${item.status === 'transit' ? 'selected' : ''}>🚚 Yolda / Transferde</option>
                <option value="out_for_delivery" ${item.status === 'out_for_delivery' ? 'selected' : ''}>🛵 Dağıtıma Çıktı</option>
                <option value="delivered" ${item.status === 'delivered' ? 'selected' : ''}>✅ Teslim Edildi</option>
                <option value="exception" ${item.status === 'exception' ? 'selected' : ''}>⚠️ Sorun / Beklemede</option>
              </select>
            </div>

            <a 
              href="${officialUrl}" 
              target="_blank" 
              rel="noopener noreferrer" 
              class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-slate-700/80 hover:bg-indigo-600 hover:text-white text-slate-200 rounded-xl font-semibold transition text-xs shadow-sm"
            >
              <span>Resmi Sitede Canlı Gör</span>
              <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
            </a>
          </div>
        `;
        container.appendChild(card);
      });
    }

    const trackInput = document.getElementById('trackNumber');
    const carrierSelect = document.getElementById('carrierSelect');
    const detectBadge = document.getElementById('detectBadge');
    const detectedName = document.getElementById('detectedName');

    trackInput.addEventListener('input', (e) => {
      const code = e.target.value.trim();
      const detected = detectCarrierSmart(code);
      if (detected && CARRIERS[detected]) {
        carrierSelect.value = detected;
        detectedName.textContent = CARRIERS[detected].name;
        detectBadge.classList.remove('hidden');
      } else {
        detectBadge.classList.add('hidden');
      }
    });

    document.getElementById('pasteBtn').addEventListener('click', async () => {
      try {
        const text = await navigator.clipboard.readText();
        if (text) {
          trackInput.value = text.trim();
          trackInput.dispatchEvent(new Event('input'));
        }
      } catch (err) {
        alert("Pano okuma izni verilemedi, lütfen elle yapıştırın.");
      }
    });

    document.getElementById('trackForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const code = trackInput.value.trim();
      const carrier = carrierSelect.value;
      const title = document.getElementById('trackTitle').value.trim();

      if (!code) return;

      const newId = 'pkg_' + Date.now();
      const newShipment = {
        id: newId,
        trackingNumber: code,
        carrier: carrier,
        title: title || '',
        status: 'transit',
        createdAt: new Date().toISOString(),
        events: [
          {
            detail: "Kargo takibe eklendi",
            location: "",
            date: new Date().toISOString()
          }
        ]
      };

      db.collection('kargolar').doc(newId).set(newShipment).catch(console.error);

      trackInput.value = '';
      document.getElementById('trackTitle').value = '';
      detectBadge.classList.add('hidden');
    });

    window.updateStatus = function(id, newStatus) {
      const item = shipments.find(s => s.id === id);
      if (item) {
        let label = "Durum güncellendi";
        if (newStatus === 'delivered') label = "Paket teslim edildi";
        if (newStatus === 'out_for_delivery') label = "Kurye dağıtıma çıktı";
        if (newStatus === 'transit') label = "Kargo yolda / transferde";

        const events = item.events || [];
        events.push({
          detail: label,
          location: "",
          date: new Date().toISOString()
        });

        db.collection('kargolar').doc(id).update({
          status: newStatus,
          events: events
        }).catch(console.error);
      }
    };

    const eventModal = document.getElementById('eventModal');
    window.openAddEventModal = function(id) {
      const item = shipments.find(s => s.id === id);
      if (!item) return;
      document.getElementById('eventShipmentId').value = id;
      document.getElementById('eventModalSubtitle').textContent = `${item.title || item.carrier.toUpperCase()} (${item.trackingNumber})`;
      document.getElementById('eventDetail').value = '';
      document.getElementById('eventLocation').value = '';
      eventModal.classList.remove('hidden');
    };

    document.getElementById('closeEventModal').addEventListener('click', () => {
      eventModal.classList.add('hidden');
    });

    document.getElementById('addEventForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const id = document.getElementById('eventShipmentId').value;
      const detail = document.getElementById('eventDetail').value.trim();
      const location = document.getElementById('eventLocation').value.trim();

      const item = shipments.find(s => s.id === id);
      if (item && detail) {
        const events = item.events || [];
        events.push({
          detail: detail,
          location: location,
          date: new Date().toISOString()
        });
        db.collection('kargolar').doc(id).update({ events: events }).catch(console.error);
        eventModal.classList.add('hidden');
      }
    });

    window.deleteShipment = function(id) {
      if (confirm('Bu kargoyu silmek istediğinize emin misiniz?')) {
        db.collection('kargolar').doc(id).delete().catch(console.error);
      }
    };

    window.copyToClipboard = function(text) {
      navigator.clipboard.writeText(text).then(() => {
        alert("Takip numarası panoya kopyalandı: " + text);
      });
    };

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.filter-btn').forEach(b => {
          b.className = "filter-btn px-2.5 py-1 rounded-lg text-slate-400 font-medium hover:text-white transition text-[11px]";
        });
        e.target.className = "filter-btn px-2.5 py-1 rounded-lg text-white font-medium bg-indigo-600 transition text-[11px]";
        currentFilter = e.target.getAttribute('data-filter');
        renderShipments();
      });
    });

    // Başlat
    listenFirestore();
  </script>
</body>
</html>
